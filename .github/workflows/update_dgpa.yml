name: Update DGPA closure data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "掃描模式 (incremental: 增量最新頁 / full: 全量回溯重刷)"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - full
      pages:
        description: "增量掃描頁數 (僅 incremental 模式生效)"
        required: false
        default: "2"
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: write

concurrency:
  group: update-dgpa-closure-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Run update_dgpa.py
        env:
          DGPA_MODE: ${{ inputs.mode || 'incremental' }}
          DGPA_INCREMENTAL_PAGES: ${{ inputs.pages || '2' }}
        run: python scripts/update_dgpa.py
      - name: Commit updated public data
        run: |
          if git diff --quiet -- data/dgpa_closures.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dgpa_closures.json
          git commit -m "chore: update DGPA closure data"
          git push
